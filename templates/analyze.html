<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Analyze Profile</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <nav>

        <h2>Student Skill Platform</h2>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/analyze">Analyze</a>

            <a href="/leaderboard">Leaderboard</a>

        </div>

    </nav>


    <section class="analyze-page">

        <div class="analyze-card">

            <h1>Analyze GitHub Profile</h1>

            <p>
                Enter a GitHub username to analyze
                skills and projects.
            </p>


            {% if error %}

                <div class="error-message">

                    {{ error }}

                </div>

            {% endif %}


            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Enter GitHub username"
                    required
                >

                <button type="submit">

                    Analyze Profile

                </button>

            </form>

        </div>

    </section>

</body>

</html>
